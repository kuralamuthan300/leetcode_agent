[project]
name = "leetcodeagent"
version = "0.1.0"
description = "LangGraph DSA solver: IntentClarifier -> Planner -> [TestCaseGen, Coder] -> Evaluator -> RunReporter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2",
  "langchain-openai>=0.3",
  "langchain-core>=0.3",
  "pydantic>=2",
  "pyyaml>=6",
  "rich>=13",
  "mlflow>=3.17.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

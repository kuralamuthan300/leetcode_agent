[project]
name = "leetcodeagent"
version = "0.1.0"
description = "LeetCode Agent (LangGraph + Ollama + Secure Sandbox)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "streamlit>=1.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
